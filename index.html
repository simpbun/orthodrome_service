<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Ортодромия</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 500px; }
        body { font-family: sans-serif; margin: 20px; }
        label { display: inline-block; width: 120px; margin-top: 5px; }
        input, select { margin: 3px; padding: 4px; }
        fieldset { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; width: 400px; }
        button { padding: 8px 20px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Построение ортодромии</h2>
    <fieldset>
        <legend>Параметры</legend>
        <div>
            <label>Point 1 (WKT):</label>
            <input type="text" id="point1" value="POINT(37.512817382812 55.75)" size="40">
        </div>
        <div>
            <label>Point 2 (WKT):</label>
            <input type="text" id="point2" value="POINT(160.76293945312 55.75)" size="40">
        </div>
        <div>
            <label>Система координат:</label>
            <select id="cs">
                <option value="4326">WGS84 (EPSG:4326)</option>
                <option value="4284">СК-42 (EPSG:4284)</option>
                <option value="3857">Меркатор (EPSG:3857)</option>
            </select>
        </div>
        <div>
            <label>Count:</label>
            <input type="number" id="count" value="10" min="2" max="100" step="1">
        </div>
        <button onclick="buildOrthodrome()">Построить</button>
    </fieldset>

    <div id="map"></div>

    <script>
        // Инициализация карты
        var map = L.map('map').setView([55.75, 97.0], 3);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var geoLayer = null;  // слой для линии

        async function buildOrthodrome() {
            var point1 = document.getElementById('point1').value.trim();
            var point2 = document.getElementById('point2').value.trim();
            var cs = parseInt(document.getElementById('cs').value);
            var count = parseInt(document.getElementById('count').value);

            if (!point1 || !point2 || isNaN(count) || count < 2) {
                alert('Заполните все поля корректно. Count должен быть >= 2.');
                return;
            }

            var payload = {
                point1: point1,
                point2: point2,
                cs: cs,
                count: count
            };

            try {
                var response = await fetch('http://127.0.0.1:5000/api/orthodrome', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    var err = await response.json();
                    alert('Ошибка: ' + (err.error || response.status));
                    return;
                }
                var geojson = await response.json();

                // Удаляем старый слой, если был
                if (geoLayer) {
                    map.removeLayer(geoLayer);
                }
                // Добавляем GeoJSON на карту (Leaflet ожидает [lat, lng], GeoJSON использует [lng, lat] - всё верно)
                geoLayer = L.geoJSON(geojson, {
                    style: { color: 'blue', weight: 3 }
                }).addTo(map);

                // Приближаем карту к границам линии
                map.fitBounds(geoLayer.getBounds(), { padding: [20, 20] });
            } catch (err) {
                alert('Ошибка соединения с сервером. Проверьте, запущен ли он.');
                console.error(err);
            }
        }
    </script>
</body>
</html>
